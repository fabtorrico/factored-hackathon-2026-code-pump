[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
description = "AI-first banking incident resolution backend"
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb>=1.5",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13",
    "pytest>=8.3",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.5",
    "ruff>=0.8",
]
# Phase 4B-1 evaluation-only extra. Deliberately NOT a runtime dependency: no LLM is wired into
# the Incident Workflow in this phase, so the OpenAI SDK is needed only to run the benchmark in
# evaluation/incident_understanding_llm/. The default test suite must not need it.
evaluation = [
    "openai>=2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

